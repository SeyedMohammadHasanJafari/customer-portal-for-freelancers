version: "3.8"

services:
  # Local PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: lumina_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-lumina_portal}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-lumina_portal}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Lumina Portal Web Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lumina_app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-lumina_portal}?schema=public
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      AUTH_SECRET: ${AUTH_SECRET:-replace-with-a-real-secret-key-32-chars}
    ports:
      - "3000:3000"

volumes:
  postgres_data:
    driver: local
